<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acme Sales Dashboard</title>
<style>
  /* Layout: sticky top bar, pill tabs, a row of stat tiles, one live bar chart; pink accent on near-neutral surfaces */
  :root {
    --bg: #eef0f6;
    --surface: #ffffff;
    --ink: #16181f;
    --muted: #9298ab;
    --line: #e7e9f1;
    --pink: #ff2d6f;
    --pink-2: #ff5c8a;
    --pink-soft: rgba(255, 45, 111, 0.12);
    --black: #15171e;
    --green: #12b76a;
    --green-soft: rgba(18, 183, 106, 0.14);
    --sage: #989992;
    --sage-bg: #e9ece2;
    --sage-glow: rgba(152, 153, 146, 0.30);
    --money: #2f9e5f;
    --chip-bg: #ffffff;
    --chip-fg: #7a8072;
    --radius: 20px;
    --shadow: 0 10px 30px rgba(22, 24, 31, 0.08);
    --shadow-lg: 0 20px 50px rgba(22, 24, 31, 0.14);
    --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1016;
      --surface: #171a22;
      --ink: #eef0f6;
      --muted: #868ca1;
      --line: #252a36;
      --pink-soft: rgba(255, 45, 111, 0.18);
      --black: #0a0c11;
      --green-soft: rgba(18, 183, 106, 0.18);
      --sage-bg: #232b25;
      --sage-glow: rgba(152, 153, 146, 0.22);
      --chip-bg: rgba(255, 255, 255, 0.08);
      --chip-fg: #aeb4a6;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1016;
    --surface: #171a22;
    --ink: #eef0f6;
    --muted: #868ca1;
    --line: #252a36;
    --pink-soft: rgba(255, 45, 111, 0.18);
    --black: #0a0c11;
    --green-soft: rgba(18, 183, 106, 0.18);
    --sage-bg: #232b25;
    --sage-glow: rgba(152, 153, 146, 0.22);
    --chip-bg: rgba(255, 255, 255, 0.08);
    --chip-fg: #aeb4a6;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background:
      radial-gradient(900px 500px at 100% -5%, rgba(255, 45, 111, 0.10) 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 8%, rgba(99, 122, 255, 0.10) 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-block: 16px;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
  }
  .topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer;
    color: var(--ink);
    width: 46px;
    height: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .icon-btn:active { transform: translateY(0); }
  .icon-btn:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .burger span {
    display: block;
    width: 18px;
    height: 2.5px;
    background: var(--ink);
    border-radius: 2px;
  }

  .bell { position: relative; }
  .bell .dot {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    background: var(--pink);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(255, 45, 111, 0.5);
    border: 2px solid var(--bg);
  }

  /* ---- Content ---- */
  .content {
    max-width: 820px;
    margin: 0 auto;
    padding-block: 10px 70px;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 999px;
    border: none;
    background: var(--black);
    color: #c8ccd8;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.18s ease, background 0.18s;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .tab.active {
    background: linear-gradient(135deg, var(--pink), var(--pink-2));
    color: #fff;
    box-shadow: 0 10px 24px rgba(255, 45, 111, 0.4);
  }

  /* ---- Stat tiles ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .stat::after {
    content: "";
    position: absolute;
    top: -40px; right: -40px;
    width: 110px; height: 110px;
    background: radial-gradient(circle, var(--pink-soft), transparent 70%);
  }
  .stat.revenue {
    background: var(--sage-bg);
    border: 1px solid var(--sage);
    padding-block: 10px;
    flex-direction: row;
    align-items: center;
    gap: 14px;
  }
  .stat.revenue::after { display: none; }
  .rev-icon {
    width: 46px; height: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    background: var(--money);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .rev-icon svg { width: 26px; height: 26px; }
  .rev-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat.revenue .value { font-size: 23px; color: var(--money); }
  .rev-right {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }
  .rev-chip {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--chip-fg);
    background: var(--chip-bg);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .rev-word {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--money);
    line-height: 1;
  }
  .stat .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    font-weight: 700;
  }
  .stat .value {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .stat .delta {
    font-size: 13px;
    font-weight: 700;
    width: fit-content;
    padding: 3px 9px;
    border-radius: 999px;
    color: var(--green);
    background: var(--green-soft);
  }

  /* ---- Chart panel ---- */
  .panel {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .panel-head h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
  .live {
    font-size: 12px;
    color: var(--green);
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .live i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .chart { display: flex; align-items: flex-end; gap: 12px; height: 200px; }
  .chart .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .chart .val {
    font-size: 10px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .chart .fill {
    width: 100%;
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-2) 100%);
    border-radius: 10px 10px 4px 4px;
    box-shadow: 0 6px 16px rgba(255, 45, 111, 0.25);
    transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .chart-labels { display: flex; gap: 12px; margin-top: 10px; }
  .chart-labels span {
    flex: 1; text-align: center;
    font-size: 11px; font-weight: 600; color: var(--muted);
  }

  /* ---- Transactions ---- */
  .tx-section { margin-top: 24px; }
  .tx-head { margin-bottom: 14px; }
  .tx-head h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
  .tx-list { display: flex; flex-direction: column; gap: 12px; }
  .tx {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 15px 16px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow);
    animation: txIn 0.35s ease;
  }
  @keyframes txIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .tx-ic {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--black); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .tx-ic svg { width: 20px; height: 20px; }
  .tx-body { flex: 1; min-width: 0; }
  .tx-amt {
    flex-shrink: 0;
    color: var(--green);
    background: var(--green-soft);
    padding: 6px 11px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .tx-title {
    font-size: 16px; font-weight: 800;
    display: flex; align-items: center; gap: 6px;
  }
  .tx-title svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
  .tx-uuid {
    font-size: 12px; color: var(--muted);
    margin-top: 3px; word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .tx-more {
    margin-top: 14px;
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .tx-more:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .tx-more:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

  /* ---- Drawer ---- */
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 270px;
    background: linear-gradient(180deg, #1b1e27, #121319);
    color: #e9ecf5;
    z-index: 30;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    padding: 24px 18px;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; padding: 0 6px;
  }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
  .close {
    background: none; border: none; color: #e9ecf5;
    font-size: 28px; cursor: pointer; line-height: 1;
  }
  .nav-item {
    display: block; padding: 13px 16px; border-radius: 12px;
    color: #aeb4c4; text-decoration: none; cursor: pointer;
    font-weight: 600; font-size: 15px; margin-bottom: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active {
    background: linear-gradient(135deg, var(--pink), var(--pink-2));
    color: #fff;
    box-shadow: 0 10px 24px rgba(255, 45, 111, 0.35);
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 12, 17, 0.5);
    backdrop-filter: blur(2px);
    z-index: 20; opacity: 0; pointer-events: none;
    transition: opacity 0.28s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* ---- Notification toast ---- */
  .notif {
    position: fixed;
    right: max(18px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 76px);
    width: min(300px, calc(100vw - 36px));
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 16px;
    z-index: 40;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .notif.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .notif h3 { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
  .notif ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .notif li { font-size: 13px; color: var(--muted); display: flex; gap: 8px; }
  .notif li b { color: var(--ink); font-weight: 700; }

  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; }
    .topbar h1 { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="overlay" id="overlay"></div>
<nav class="drawer" id="drawer" aria-label="Main menu">
  <div class="drawer-head">
    <span class="logo">◆ Acme Co.</span>
    <button class="close" id="closeBtn" aria-label="Close menu">×</button>
  </div>
  <a class="nav-item active">Dashboard</a>
  <a class="nav-item">Orders</a>
  <a class="nav-item">Customers</a>
  <a class="nav-item">Products</a>
  <a class="nav-item">Settings</a>
</nav>

<header class="topbar">
  <button class="icon-btn burger" id="menuBtn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <h1>Dashboard</h1>
  <button class="icon-btn bell" id="bellBtn" aria-label="Notifications">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="dot">3</span>
  </button>
</header>

<div class="notif" id="notif">
  <h3>Notifications</h3>
  <ul>
    <li><b>New order</b> #1043 · $128</li>
    <li><b>Payout</b> processed to bank</li>
    <li><b>Weekly report</b> is ready</li>
  </ul>
</div>

<main class="content">
  <div class="tabs" id="tabs">
    <button class="tab active" data-range="today">Today</button>
    <button class="tab" data-range="week">Per Week</button>
    <button class="tab" data-range="month">Per Month</button>
    <button class="tab" data-range="overall">Overall</button>
  </div>

  <div class="stats">
    <div class="stat revenue">
      <div class="rev-icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9.2 2.5h5.6a.9.9 0 0 1 .72 1.44L13.9 6.3H10.1L8.48 3.94A.9.9 0 0 1 9.2 2.5z" fill="#fff"/>
          <path d="M10 6.3h4c1.3 1.1 5.2 3.4 5.2 9.1A6.6 6.6 0 0 1 12.6 22h-1.2A6.6 6.6 0 0 1 4.8 15.4C4.8 9.7 8.7 7.4 10 6.3z" fill="#fff"/>
          <text x="12" y="17" text-anchor="middle" font-size="9" font-weight="800" fill="var(--money)" font-family="sans-serif">$</text>
        </svg>
      </div>
      <div class="rev-main">
        <span class="value" id="revenue">$2,154</span>
      </div>
      <div class="rev-right">
        <span class="rev-word">Profit</span>
      </div>
    </div>
  </div>

  <section class="tx-section">
    <div class="tx-head"><h2>Recent transactions</h2></div>
    <div class="tx-list" id="txList"></div>
    <button class="tx-more" id="txMore">See all transactions</button>
  </section>

  <div class="panel" style="margin-top:24px">
    <div class="panel-head">
      <h2>Revenue trend</h2>
      <span class="live"><i></i> live</span>
    </div>
    <div class="chart" id="chart"></div>
    <div class="chart-labels" id="chartLabels"></div>
  </div>
</main>

<script>
  // Base figures per time range (sample data). Each tick nudges them slightly for a live feel.
  const DATA = {
    today:   { revenue: 4820,    orders: 63,    visitors: 1240,   delta: "+4.2%", labels: ["6a","9a","12p","3p","6p","9p"] },
    week:    { revenue: 31450,   orders: 418,   visitors: 8730,   delta: "+9.1%", labels: ["Mon","Tue","Wed","Thu","Fri","Sat"] },
    month:   { revenue: 128900,  orders: 1724,  visitors: 36100,  delta: "+6.5%", labels: ["W1","W2","W3","W4","W5","W6"] },
    overall: { revenue: 1540000, orders: 20880, visitors: 442000, delta: "+22%",  labels: ["Jan","Mar","May","Jul","Sep","Nov"] },
  };

  let range = "today";

  const $ = (id) => document.getElementById(id);
  const revenueEl = $("revenue");
  const chartEl = $("chart"), labelsEl = $("chartLabels");

  const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const num   = (n) => Math.round(n).toLocaleString("en-US");

  // Compact money label: 2150 -> "$2.2k", 64620 -> "$64.6k".
  function compact(n) {
    if (n >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "k";
    return "$" + Math.round(n);
  }

  // Split the period's total across the six bars with a believable shape (midday/afternoon peak).
  function rangeValues() {
    const total = profit * RANGE_MULT[range];
    const shape = [0.7, 0.9, 1.25, 1.35, 1.15, 0.95];
    const w = shape.map((b) => b * (0.9 + Math.random() * 0.2));
    const sum = w.reduce((a, b) => a + b, 0);
    return w.map((x) => total * x / sum);
  }

  function buildChart() {
    const labels = DATA[range].labels;
    const vals = rangeValues();
    const max = Math.max(...vals);
    chartEl.innerHTML = "";
    labelsEl.innerHTML = "";
    vals.forEach((v, i) => {
      const col = document.createElement("div");
      col.className = "col";
      const val = document.createElement("div");
      val.className = "val";
      val.textContent = compact(v);
      const fill = document.createElement("div");
      fill.className = "fill";
      fill.style.height = Math.max(8, Math.round((v / max) * 150)) + "px";
      col.appendChild(val);
      col.appendChild(fill);
      chartEl.appendChild(col);

      const lbl = document.createElement("span");
      lbl.textContent = labels[i];
      labelsEl.appendChild(lbl);
    });
  }

  $("tabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    range = tab.dataset.range;
    showProfit();
    initTransactions();
    buildChart();
  });

  const drawer = $("drawer"), overlay = $("overlay");
  const openMenu  = () => { drawer.classList.add("open"); overlay.classList.add("show"); };
  const closeMenu = () => { drawer.classList.remove("open"); overlay.classList.remove("show"); };
  $("menuBtn").addEventListener("click", openMenu);
  $("closeBtn").addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);

  const notif = $("notif");
  $("bellBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    notif.classList.toggle("show");
  });
  document.addEventListener("click", (e) => {
    if (!notif.contains(e.target) && e.target.closest("#bellBtn") === null) {
      notif.classList.remove("show");
    }
  });

  // ---- Recent transactions (sample data, newest on top) ----
  const CHAIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
  const LINKOUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
  const txList = $("txList");
  const txMore = $("txMore");
  let nextTxId, oldestId, HISTORY_FLOOR;

  function uuid() {
    const h = "0123456789abcdef";
    let s = "";
    for (let i = 0; i < 32; i++) s += h[Math.floor(Math.random() * 16)];
    const y = "89ab"[Math.floor(Math.random() * 4)];
    return s.slice(0,8) + "-" + s.slice(8,12) + "-4" + s.slice(13,16) + "-" + y + s.slice(17,20) + "-" + s.slice(20,32);
  }

  // Random amount between +$1.77 and +$11.44; 85% land under $3, the rest span up to the max.
  function amount() {
    if (Math.random() < 0.85) return (1.77 + Math.random() * 1.22).toFixed(2); // 1.77–2.99
    return (3.00 + Math.random() * 8.44).toFixed(2);                           // 3.00–11.44
  }

  function makeTx(id, amt) {
    const row = document.createElement("div");
    row.className = "tx";
    row.innerHTML =
      '<div class="tx-ic">' + CHAIN + '</div>' +
      '<div class="tx-body">' +
        '<div class="tx-title">Transaction ID: ' + id + ' ' + LINKOUT + '</div>' +
        '<div class="tx-uuid">UUID: ' + uuid() + '</div>' +
      '</div>' +
      '<div class="tx-amt">+$' + amt + '</div>';
    return row;
  }

  // Today's running total; each new transaction adds its amount. Other ranges scale from it.
  let profit = 2154;
  const RANGE_MULT = { today: 1, week: 7, month: 30, overall: 365 };
  function showProfit() {
    const total = profit * RANGE_MULT[range];
    revenueEl.textContent = "$" + total.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  // Build the transaction list for the current range. Today's newest is ~587, so a week
  // has ~7x as many transactions, a month ~30x, overall ~365x — the numbers scale with the range.
  const DAILY_TOP = 587;
  function initTransactions() {
    const top = Math.round(DAILY_TOP * RANGE_MULT[range]);
    nextTxId = top + 1;              // next live one
    oldestId = top - 4;             // five shown: top down to top-4
    HISTORY_FLOOR = oldestId - 100; // 100 older available via "See all"
    txList.innerHTML = "";
    for (let id = top; id >= top - 4; id--) txList.appendChild(makeTx(id, amount()));
    txMore.hidden = false;
  }

  // "See all transactions": reveal 20 older ones per click, from the pool of 100.
  txMore.addEventListener("click", () => {
    const chunk = Math.min(20, oldestId - HISTORY_FLOOR);
    for (let i = 0; i < chunk; i++) {
      oldestId -= 1;
      txList.appendChild(makeTx(oldestId, amount()));
    }
    if (oldestId <= HISTORY_FLOOR) txMore.hidden = true;
  });

  // A new transaction arrives every 6 seconds (animated on the Today view).
  setInterval(() => {
    const amt = amount();
    profit += parseFloat(amt);
    if (range === "today") {
      txList.insertBefore(makeTx(nextTxId++, amt), txList.firstChild);
      showProfit();
    }
  }, 6000);

  initTransactions();
  buildChart();
</script>
</body>
</html>
